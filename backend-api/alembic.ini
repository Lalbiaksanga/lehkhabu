[alembic]
# Path to the alembic scripts
script_location = alembic

# Where migration version scripts are stored
version_locations = alembic/versions

# Prepend backend-api to sys.path so app.* imports work
prepend_sys_path = .

# Naming convention for auto-generated migration files
# e.g. 0001_add_users_table.py
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

# Database URL — overridden in env.py from settings
# Leave blank here; env.py reads it from ../.env
sqlalchemy.url =

[post_write_hooks]
# Uncomment to auto-format migrations with black:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
