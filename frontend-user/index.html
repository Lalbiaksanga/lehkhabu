<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── PWA & Mobile ─────────────────────────────────── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lehkhabu" />
    <meta name="application-name" content="Lehkhabu" />
    <meta name="msapplication-TileColor" content="#8B5E3C" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />
    <meta name="format-detection" content="telephone=no" />

    <!-- ── Theme ─────────────────────────────────────────── -->
    <meta name="theme-color" content="#8B5E3C" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FDF6EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#FDF6EC" />

    <!-- ── Icons ─────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#8B5E3C" />

    <!-- ── SEO: Primary Meta ──────────────────────────────── -->
    <title>Lehkhabu — Read, Discover, Collect</title>
    <meta name="description" content="Lehkhabu — Your AI-powered book marketplace. Discover, read, and collect your favourite books from talented authors." />
    <meta name="keywords" content="books, reading, ebooks, book marketplace, Mizo books, digital library, Lehkhabu" />
    <meta name="author" content="Lehkhabu" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://lehkhabu.com/" />

    <!-- ── Open Graph ─────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lehkhabu" />
    <meta property="og:title" content="Lehkhabu — Read, Discover, Collect" />
    <meta property="og:description" content="Your AI-powered book marketplace. Discover, read, and collect your favourite books." />
    <meta property="og:image" content="https://lehkhabu.com/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:url" content="https://lehkhabu.com/" />
    <meta property="og:locale" content="en_IN" />

    <!-- ── Twitter Card ───────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lehkhabu — Read, Discover, Collect" />
    <meta name="twitter:description" content="Your AI-powered book marketplace. Discover, read, and collect your favourite books." />
    <meta name="twitter:image" content="https://lehkhabu.com/icons/icon-512.png" />

    <!-- ── Performance: Resource Hints ───────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://puwqymuuibpysixvkund.supabase.co" />
    <link rel="dns-prefetch" href="https://puwqymuuibpysixvkund.supabase.co" />

    <!-- ── Fonts ──────────────────────────────────────────── -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- ── Structured Data: WebSite + SearchAction ───────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Lehkhabu",
      "url": "https://lehkhabu.com",
      "description": "Your AI-powered book marketplace. Discover, read, and collect your favourite books.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://lehkhabu.com/explore?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Lehkhabu",
        "logo": {
          "@type": "ImageObject",
          "url": "https://lehkhabu.com/icons/icon-512.png"
        }
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
